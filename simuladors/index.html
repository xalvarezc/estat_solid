<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simuladors — Física de l'Estat Sòlid</title>
<link rel="stylesheet" href="estil_comu.css">
<style>
  h1{ font-size:1.4rem; margin:0 0 4px; }
  p.sub{ color:var(--muted); font-size:.9rem; margin:0 0 28px; }

  .tema{
    border:1px solid var(--border); border-radius:8px; background:var(--surface);
    margin-bottom:14px; overflow:hidden;
  }
  .tema-cap{
    display:flex; align-items:center; gap:16px; padding:14px 18px; cursor:pointer;
    user-select:none;
  }
  .tema-cap:hover{ background:var(--surface-2); }
  .tema-cap .tema-icona{
    width:56px; height:56px; border-radius:6px; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background:var(--surface-2); color:var(--uabgreen);
  }
  .tema-cap .tema-icona svg{ width:32px; height:32px; }
  .tema-info{ flex:1; }
  .tema-num{ font-family:var(--font-mono); font-size:.72rem; color:var(--accent); letter-spacing:.05em; }
  .tema-nom{ font-size:1.02rem; font-weight:700; color:var(--ink); }
  .tema-count{ font-family:var(--font-mono); font-size:.75rem; color:var(--muted); white-space:nowrap; }
  .chevron{ font-size:.8rem; color:var(--muted); transition:transform .2s; }
  .tema.obert .chevron{ transform:rotate(90deg); }

  .tema-cos{
    max-height:0; overflow:hidden; transition:max-height .25s ease;
    border-top:1px solid var(--border);
  }
  /* l'alçada de la llista oberta la fixa el JS segons el contingut real (vegeu obre()) */
  .llista-sim{ list-style:none; margin:0; padding:10px 18px 16px 90px; }
  .llista-sim li{ padding:8px 0; border-bottom:1px solid var(--border); font-size:.92rem; }
  .llista-sim li:last-child{ border-bottom:none; }
  .llista-sim a{ color:var(--accent); text-decoration:none; font-weight:600; }
  .llista-sim a:hover{ text-decoration:underline; }
  .llista-sim .desc{ color:var(--muted); font-size:.82rem; display:block; margin-top:2px; }
  .buit{ padding:14px 18px 16px 90px; color:var(--muted); font-size:.85rem; font-style:italic; }
</style>
</head>
<body>
<div class="capcalera-uab">
  <div class="logo-bloc">
    <a href="../" title="Portada del curs"><img src="imatges/logotip-versio-3-verd.png" alt="UAB"></a>
    <a href="../" class="boto-pill link-tornar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <path d="M19 12H5M11 6l-6 6 6 6"/>
      </svg>
      Portada del curs
    </a>
  </div>
  <div class="tema-actual">Banc de simuladors</div>
  <div class="titol-curs">Física de l'Estat Sòlid</div>
</div>

<div class="contingut">
  <h1>Simuladors per tema</h1>
  <p class="sub">Clica un tema per veure'n els simuladors interactius disponibles.</p>

  <div id="llista-temes"></div>
</div>
<div class="peu-uab">F. Xavier Àlvarez — Física de l'Estat Sòlid</div>

<script src="temes.js"></script>
<script>

const cont = document.getElementById('llista-temes');
TEMES.forEach((t, idx) => {
  const div = document.createElement('div');
  div.className = 'tema';
  div.id = 'tema-' + t.num;

  const cap = document.createElement('div');
  cap.className = 'tema-cap';

  const icona = document.createElement('div');
  icona.className = 'tema-icona';
  icona.innerHTML = ICONES[t.num];
  cap.appendChild(icona);

  const info = document.createElement('div');
  info.className = 'tema-info';
  const etiqueta = t.etiqueta || ('TEMA ' + t.num);
  info.innerHTML = `<div class="tema-num">${etiqueta}</div><div class="tema-nom">${t.nom}</div>`;
  cap.appendChild(info);

  const count = document.createElement('div');
  count.className = 'tema-count';
  count.textContent = t.simuladors.length ? `${t.simuladors.length} simulador${t.simuladors.length>1?'s':''}` : 'cap encara';
  cap.appendChild(count);

  const chev = document.createElement('div');
  chev.className = 'chevron';
  chev.textContent = '▶';
  cap.appendChild(chev);

  const cos = document.createElement('div');
  cos.className = 'tema-cos';
  if (t.simuladors.length){
    const ul = document.createElement('ul');
    ul.className = 'llista-sim';
    t.simuladors.forEach(s => {
      const li = document.createElement('li');
      li.innerHTML = `<a href="${s.href}">${s.nom}</a><span class="desc">${s.desc}</span>`;
      ul.appendChild(li);
    });
    cos.appendChild(ul);
  } else {
    const buit = document.createElement('div');
    buit.className = 'buit';
    buit.textContent = 'Encara no hi ha cap simulador per a aquest tema.';
    cos.appendChild(buit);
  }

  cap.addEventListener('click', () => obre(div, !div.classList.contains('obert')));

  div.appendChild(cap);
  div.appendChild(cos);
  cont.appendChild(div);
});

// Obre o tanca un tema; l'alçada s'ajusta al contingut, tingui els simuladors que tingui
function obre(div, siNo){
  div.classList.toggle('obert', siNo);
  const cos = div.querySelector('.tema-cos');
  cos.style.maxHeight = siNo ? cos.scrollHeight + 'px' : '0px';
}
// Si canvia l'amplada de la finestra, el text es reparteix diferent: recalcula els oberts
window.addEventListener('resize', () => document.querySelectorAll('.tema.obert').forEach(d => obre(d, true)));

// Obre el tema de l'enllaç (#tema-04, des de la portada) o, si no n'hi ha, el primer amb simuladors
function obreDesDeHash(){
  const desti = location.hash && document.getElementById(location.hash.slice(1));
  if (desti && desti.classList.contains('tema')) {
    obre(desti, true);
    desti.scrollIntoView({block:'start'});
    return true;
  }
  return false;
}
if (!obreDesDeHash()) {
  const primerAmbSim = TEMES.findIndex(t => t.simuladors.length);
  if (primerAmbSim >= 0) obre(cont.children[primerAmbSim], true);
}
window.addEventListener('hashchange', obreDesDeHash);
</script>
</body>
</html>
